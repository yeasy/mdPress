name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A dependency CVE is disclosed on its own timetable, not ours. Without a
  # schedule the vuln job below would only ever run when someone happened to
  # push, so a vulnerable release could sit unflagged indefinitely.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Download dependencies
      run: go mod download

    # An untidy go.mod used to surface only at release time, where goreleaser's
    # `go mod tidy` before-hook rewrote it mid-run and built the release from a
    # different module graph than CI tested.
    - name: Check go.mod is tidy
      if: matrix.os == 'ubuntu-latest'
      run: go mod tidy -diff

    - name: Run go vet
      run: go vet ./...

    - name: Run tests (with coverage)
      if: matrix.os == 'ubuntu-latest'
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Run tests
      if: matrix.os != 'ubuntu-latest'
      run: go test -v -race ./...

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        files: coverage.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'

    - name: Build binary
      run: go build -v -o mdpress .

    - name: Verify binary
      run: ./mdpress --help

  docker:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Build minimal Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        target: minimal
        load: true
        push: false
        # Pass a recognisable VERSION so the smoke test proves the build-arg is
        # wired to the ldflags. Without it the image compiles with the
        # Dockerfile default ("dev") and could not catch a version-stamping
        # regression -- which is how two releases shipped a wrong version.
        build-args: |
          VERSION=ci-test
        tags: mdpress:test-minimal
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify minimal image
      run: |
        set -euo pipefail
        docker run --rm mdpress:test-minimal --help
        got="$(docker run --rm mdpress:test-minimal version --json | jq -re .version)"
        echo "image reports version $got"
        [ "$got" = "ci-test" ] || { echo "::error::VERSION build-arg is not reaching the binary (got '$got')"; exit 1; }

    - name: Build full Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        target: full
        load: true
        push: false
        build-args: |
          VERSION=ci-test
        tags: mdpress:test-full
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify full image
      run: |
        set -euo pipefail
        docker run --rm mdpress:test-full --help
        got="$(docker run --rm mdpress:test-full version --json | jq -re .version)"
        echo "image reports version $got"
        [ "$got" = "ci-test" ] || { echo "::error::VERSION build-arg is not reaching the binary (got '$got')"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.12.2

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26'

    # golangci-lint does not check CVEs and CodeQL only analyses this repo's own
    # code, so nothing here used to fail on a known vulnerability in the
    # dependency graph -- Dependabot could only open a PR after upstream shipped
    # a fix. govulncheck is reachability-aware: it reports a CVE only when the
    # vulnerable symbol is actually called from this module, which keeps the
    # gate from firing on advisories that cannot affect mdpress.
    #
    # If an unfixable upstream advisory ever blocks unrelated work, downgrade
    # this step with `continue-on-error: true` rather than deleting it, so the
    # finding stays visible in the run summary.
    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
